name: Build & Push (GHCR)

on:
  push:
    branches: [ main ]
    paths:
      - "server/**"
      - "client/**"
      - "pyworker/**"
      - "nginx/**"
      - "docker-bake.hcl"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write   # <-- lets GITHUB_TOKEN push to ghcr.io/<org>

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Login to GHCR using the built-in GITHUB_TOKEN
      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set TAGs
        id: tags
        run: |
          # Tag "latest" on main, plus a short SHA tag for traceability.
          if [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "TAG1=latest" >> $GITHUB_OUTPUT
          fi
          echo "TAG2=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Build & push :latest (on main)
      - name: Build & Push latest
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ghcr.io/cornellev
          TAG: latest
        run: |
          docker buildx bake -f docker-bake.hcl --push

      # Build & push :<short-sha> every run
      - name: Build & Push sha tag
        env:
          REGISTRY: ghcr.io/cornellev
          TAG: ${{ github.sha.substr(0,7) }}
        run: |
          docker buildx bake -f docker-bake.hcl --push
