services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=3000
      - HOST=${HOST}
    volumes:
      - ./client:/app
      - /app/node_modules

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-5000}:5000"
    depends_on:
      - db
      - pyworker
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - PYWORKER_URL=http://pyworker:8000
    volumes:
      - ./server:/app
      - /app/node_modules
      - uploads-folder:/app/uploads-folder
      - saved_data:/app/saved_data
    command: npm run dev

  pyworker:
    build:
      context: ./pyworker
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./pyworker:/app
      - uploads-folder:/app/uploads-folder
      - saved_data:/app/saved_data
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    depends_on:
      - db
    command:
      - bash
      - -c
      - >
        source /opt/ros/humble/setup.bash &&
        source /ros_ws/install/setup.bash &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - client
      - server
      - pyworker
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
  uploads-folder:
  saved_data:
