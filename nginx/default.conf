map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream pyworker {
    server pyworker:8000;
}

server {
  listen 80;
  server_name visualization_toolbox;  # set to your domain in prod

  client_max_body_size 500M;

  # Forwarded headers so Express/uvicorn can reconstruct original URL
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;

  # Reasonable timeouts for WS / HMR / SSE
  proxy_read_timeout  600s;
  proxy_send_timeout  600s;

  # HMR websocket endpoint
  location /sockjs-node/ {
    proxy_pass http://client:3000/sockjs-node/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
  }

  # React dev server
  location / {
    proxy_pass http://client:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
  }

  # REST API (keep both /api and /api/)
  location /api/ {
    proxy_pass http://server:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location = /api {
    proxy_pass http://server:5000/api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Uploaded files served by server
  location /upload-folder/ {
    proxy_pass http://server:5000/upload-folder/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location = /upload-folder {
    proxy_pass http://server:5000/upload-folder;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Pyworker (uvicorn, supports websockets)
  location /ev/ {
    proxy_pass http://pyworker:8000/ev/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /ev {
    proxy_pass http://pyworker:8000/ev;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
